# BotForg — пример конфига Nginx (reverse proxy на backend + статика frontend)
# Подставьте YOUR_DOMAIN. Backend слушает на localhost:8001.
# Размещение: /etc/nginx/sites-available/botforg.conf
# Активация: sudo ln -s /etc/nginx/sites-available/botforg.conf /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 10M;

upstream botforg_backend {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Проксирование API на backend (корректные заголовки для CORS и клиента)
    location ~ ^/(api|auth|me|bots|templates|scenarios|billing|payments|messages|user-templates|bot-templates|legal|privacy|chat|analytics|blocks|media|health|healthz|docs|openapi.json|uploads) {
        proxy_pass http://botforg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 90s;
    }

    # Статика frontend (сборка в /var/www/botforg)
    root /var/www/botforg;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

