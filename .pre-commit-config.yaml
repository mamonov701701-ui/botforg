# Pre-commit hooks for BotForg repository
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter (replaces Black, isort, Flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.11
    hooks:
      # Run the linter
      - id: ruff
        name: ruff lint
        files: ^backend/
        exclude: ^backend/(venv|__pycache__|migrations)/
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format
        name: ruff format
        files: ^backend/
        exclude: ^backend/(venv|__pycache__|migrations)/

  # Trailing whitespace and end-of-file fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        files: \.(py|js|jsx|ts|tsx|json|md|yaml|yml)$
      - id: end-of-file-fixer
        files: \.(py|js|jsx|ts|tsx|json|md|yaml|yml)$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Frontend - Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(js|jsx|ts|tsx|json|css|md)$
        exclude: ^(backend|venv|node_modules|dist|build)/
        additional_dependencies:
          - prettier@3.0.0
