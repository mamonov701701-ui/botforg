# Pre-commit hooks for BotForg repository
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        language_version: python3
        files: ^backend/
        exclude: ^backend/(venv|__pycache__|migrations)/

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        files: ^backend/
        exclude: ^backend/(venv|__pycache__|migrations)/
        args: ["--profile", "black"]

  # Python linting with Flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: ^backend/
        exclude: ^backend/(venv|__pycache__|migrations)/
        args:
          - --max-line-length=120
          - --extend-ignore=E203,W503
          - --exclude=venv,__pycache__,migrations

  # Trailing whitespace and end-of-file fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        files: \.(py|js|jsx|ts|tsx|json|md|yaml|yml)$
      - id: end-of-file-fixer
        files: \.(py|js|jsx|ts|tsx|json|md|yaml|yml)$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Frontend - Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(js|jsx|ts|tsx|json|css|md)$
        exclude: ^(backend|venv|node_modules|dist|build)/
        additional_dependencies:
          - prettier@3.0.0

  # Security check - detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(\.secrets\.baseline|package-lock\.json)$

